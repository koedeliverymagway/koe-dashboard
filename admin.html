<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>KOE Delivery Admin · မကွေး</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(135deg,#e8f4f8 0%,#dde8f5 30%,#e8ddf5 65%,#f5e8dd 100%);
    }
    #gas-frame {
      position: fixed;
      top: 0;
      left: 0;
      /* width/height set by JS below */
      border: none;
      transform-origin: top left;
    }
    #cover {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(135deg,#e8f4f8 0%,#dde8f5 30%,#e8ddf5 65%,#f5e8dd 100%);
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="gas-frame" allowfullscreen></iframe>
  <div id="cover"></div>
  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbxjn3rrFtqs4YqHWPjEzvx-z4yFACvlE0teg_UqHAnkTCAKPayJO9W8G1Zey8kuvY92/exec';

    // Desktop width ကို phone screen မှာ scale ချပြတဲ့ trick
    var DESKTOP_W = 980;
    var frame = document.getElementById('gas-frame');

    function applyScale() {
      var scale = window.innerWidth / DESKTOP_W;
      frame.style.width  = DESKTOP_W + 'px';
      frame.style.height = (window.innerHeight / scale) + 'px';
      frame.style.transform = 'scale(' + scale + ')';
    }

    applyScale();
    window.addEventListener('resize', applyScale);

    frame.src = GAS_URL + window.location.search;
  </script>
</body>
</html>
