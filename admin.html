<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>KOE Delivery Admin · မကွေး</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1280px;
      height: 100%;
      height: 100dvh;
      overflow-x: auto;
      overflow-y: hidden;
      background: linear-gradient(135deg,#e8f4f8 0%,#dde8f5 30%,#e8ddf5 65%,#f5e8dd 100%);
    }

    #gas-frame {
      position: fixed;
      top: 0; left: 0;
      width: 1280px;
      height: 100%;
      height: 100dvh;
      border: none;
    }

    /* Google warning bar ဖုံးတဲ့ overlay */
    #cover {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 30px;
      background: linear-gradient(135deg,#e8f4f8 0%,#dde8f5 30%,#e8ddf5 65%,#f5e8dd 100%);
      background-attachment: fixed;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="cover"></div>
  <iframe id="gas-frame" allowfullscreen></iframe>
  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbxjn3rrFtqs4YqHWPjEzvx-z4yFACvlE0teg_UqHAnkTCAKPayJO9W8G1Zey8kuvY92/exec';
    document.getElementById('gas-frame').src = GAS_URL + window.location.search;
  </script>
</body>
</html>
