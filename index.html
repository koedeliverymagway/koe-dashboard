<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=980">
  <title>KOE Dashboard · မကွေး</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:#0F172A; }
    iframe { width:100%; height:100vh; border:none; display:block; }
  </style>
</head>
<body>
  <script>
    var base = 'https://script.google.com/macros/s/AKfycbxjn3rrFtqs4YqHWPjEzvx-z4yFACvlE0teg_UqHAnkTCAKPayJO9W8G1Zey8kuvY92/exec';
    var params = window.location.search;
    var iframe = document.createElement('iframe');
    iframe.src = base + params;
    iframe.style.cssText = 'width:100%;height:100vh;border:none;display:block';
    document.body.appendChild(iframe);
  </script>
</body>
</html>
