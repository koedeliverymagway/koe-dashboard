<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>KOE Delivery · မကွေး</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    iframe {
 top: 0; left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;0% + 40px);
      height: calc(100dvh + 40px);
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="f" allowfullscreen></iframe>
  <script>
    var GAS = 'https://script.google.com/macros/s/AKfycbxjn3rrFtqs4YqHWPjEzvx-z4yFACvlE0teg_UqHAnkTCAKPayJO9W8G1Zey8kuvY92/exec';
    // Forward ?action=track&id=K-xxxx (or any other params) straight to GAS
    document.getElementById('f').src = GAS + window.location.search;
  </script>
</body>
</html>
